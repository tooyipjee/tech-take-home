name: services

# The banking-scenario services under services/. Only the services that already have a test
# framework run here; the inventory in services/README.md says which ones do not, and that gap
# is deliberate — it is part of what the demo is about.
on:
  push:
    branches: [main, learning]
    paths: ["services/**", ".github/workflows/services.yml"]
  pull_request:
    paths: ["services/**", ".github/workflows/services.yml"]

jobs:
  java:
    name: java (junit + jacoco)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - run: mvn -q -B -s maven-settings.xml -f java/pom.xml test
        working-directory: services
      - uses: actions/upload-artifact@v4
        with:
          name: jacoco
          path: services/java/*/target/site/jacoco/

  typescript:
    name: typescript (node --test)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [mobile-bff, card-controls]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: npm ci
      - run: npm run typecheck
        working-directory: services/ts/${{ matrix.service }}
      - run: npm test
        working-directory: services/ts/${{ matrix.service }}

  python:
    name: python (pytest)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [fraud-scoring]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v4
        with:
          python-version: "3.12"
      - run: pip install pytest pytest-cov
      - run: python -m pytest
        working-directory: services/python/${{ matrix.service }}

  coverage:
    name: coverage table
    runs-on: ubuntu-latest
    needs: [java, typescript, python]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17", cache: maven }
      - uses: actions/setup-node@v4
        with: { node-version: "24" }
      - uses: actions/setup-python@v4
        with: { python-version: "3.12" }
      - run: npm ci
      - run: pip install pytest pytest-cov
      - run: make coverage | tee $GITHUB_STEP_SUMMARY
        working-directory: services
